<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--md-sys-color-primary, #6366f1)" />
      <stop offset="100%" stop-color="var(--md-sys-color-tertiary, #06b6d4)" />
    </linearGradient>
  </defs>
  <!-- Outer ring representing Payment Ground / Loop -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#logoGrad)" stroke-width="36" />
  
  <!-- Wallet shape -->
  <g fill="url(#logoGrad)">
    <!-- Folded top cover -->
    <path d="M 165,171 H 317 A 24,24 0 0 1 341,195 V 205 H 141 V 195 A 24,24 0 0 1 165,171 Z" opacity="0.85" />
    <!-- Main body -->
    <rect x="141" y="201" width="200" height="140" rx="24" />
    <!-- Clasp/flap -->
    <rect x="311" y="246" width="60" height="50" rx="16" />
    <!-- Snap button -->
    <circle cx="346" cy="271" r="7" fill="var(--md-sys-color-surface-container-lowest, #ffffff)" />
  </g>
  <!-- Rupee sign in the center -->
  <svg x="196" y="226" width="90" height="90" viewBox="0 0 16 16" fill="var(--md-sys-color-surface-container-lowest, #ffffff)">
    <path d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z"/>
  </svg>
</svg>
